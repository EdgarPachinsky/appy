name: appy
description: "Appy — run and manage your local projects from one place."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  desktop_drop: ">=0.6.0 <0.9.0"
  file_selector: ^1.0.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
    - assets/appy_logo.png
